services:
  runtime:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${CONTROLLED_AGENT_PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${CONTROLLED_AGENT_PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      DASHSCOPE_API_BASE: ${DASHSCOPE_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MODEL_NAME: ${MODEL_NAME:-qwen-plus}
      CONTROLLED_AGENT_DB_PATH: /app/data/memory.db
    volumes:
      - runtime-data:/app/data
volumes:
  runtime-data:
